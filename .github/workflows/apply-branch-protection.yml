name: Apply branch protection

# Manual only, and deliberately so. This is the one workflow in this repository
# that changes repository settings rather than checking code, so it must never
# be reachable from a pull request — least of all from a fork's. `workflow_dispatch`
# is the whole trigger list: no `push`, no `pull_request`, no schedule.
#
# Note for whoever runs it: GitHub only offers the "Run workflow" button for
# workflows present on the **default branch**. Until this file reaches `main`,
# it cannot be dispatched from a feature branch.
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Report what main enforces without writing anything'
        type: boolean
        default: false

# The job authenticates as the GitHub App, not as GITHUB_TOKEN, so the default
# token needs nothing beyond reading this repository's own code.
permissions:
  contents: read

concurrency:
  group: apply-branch-protection
  cancel-in-progress: false

jobs:
  apply:
    name: Apply branch protection
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `actions/create-github-app-token` reports a malformed private key as
      # `Invalid keyData` / `ERR_OSSL_ASN1_NOT_ENOUGH_DATA`, which is accurate
      # and tells you nothing about which way it is malformed. Runs
      # 35160860535, 35160953245 and 35161239974 all died there. This step says
      # which, using only the *shape* of the secret: whether it is set, how many
      # bytes and lines it has, and whether its first and last lines are PEM
      # delimiters. No byte of the key is printed, and `grep -q` is silent by
      # construction. A 2048-bit RSA PEM is roughly 1,700 bytes over about 27
      # lines; one line, or a few hundred bytes, means the newlines were lost or
      # the paste was truncated.
      - name: Check the credentials are well formed
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          [ -n "$APP_ID" ] || fail 'The APP_ID secret is empty or not set.'
          [ -n "$APP_PRIVATE_KEY" ] || fail 'The APP_PRIVATE_KEY secret is empty or not set.'
          echo 'APP_ID is set.'

          bytes=$(printf '%s' "$APP_PRIVATE_KEY" | wc -c | tr -d ' ')
          lines=$(printf '%s\n' "$APP_PRIVATE_KEY" | wc -l | tr -d ' ')
          echo "APP_PRIVATE_KEY is set: ${bytes} bytes across ${lines} line(s)."

          printf '%s\n' "$APP_PRIVATE_KEY" | head -1 | grep -q -- '-----BEGIN .*PRIVATE KEY-----' \
            || fail 'The first line of APP_PRIVATE_KEY is not a PEM header. Paste the whole .pem file, including the BEGIN and END lines.'
          printf '%s\n' "$APP_PRIVATE_KEY" | grep -q -- '-----END .*PRIVATE KEY-----' \
            || fail 'APP_PRIVATE_KEY has no PEM footer. The paste looks truncated.'
          [ "$lines" -gt 3 ] \
            || fail "APP_PRIVATE_KEY is only ${lines} line(s). A PEM is many lines; the newlines were lost when it was pasted."
          [ "$bytes" -gt 800 ] \
            || fail "APP_PRIVATE_KEY is only ${bytes} bytes, far short of an RSA private key. The paste looks truncated."

          echo 'Shape looks like a PEM private key. Whether it is the right key is for the next step to find out.'

      # Mints an installation token that expires in an hour, from secrets this
      # job never reads itself. Actions masks the minted token in logs, and
      # nothing below echoes it: it is passed to the script through the
      # environment and used only as a request header.
      - name: Mint a short-lived App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # The mode goes through the environment rather than being interpolated
      # into the shell line. `verify_only` is a boolean and so cannot carry
      # arbitrary text, but a workflow that writes repository settings is the
      # wrong place to rely on that.
      - name: Apply the approved ruleset
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MODE: ${{ inputs.verify_only && '--verify-only' || '' }}
        run: node scripts/apply-branch-protection.mjs $MODE

      # Revoking is not strictly required — the token expires within the hour —
      # but a credential that is dead the moment it is no longer needed is one
      # fewer thing to reason about if a log is ever shared.
      - name: Revoke the token
        # Only if one was actually minted. On the three runs that failed at the
        # minting step this ran with an empty header and reported `HTTP 401`,
        # which reads like an authentication problem and is really just a
        # request with nothing in it.
        if: always() && steps.app-token.outputs.token != ''
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl --silent --show-error --output /dev/null \
            --write-out 'token revocation: HTTP %{http_code}\n' \
            --request DELETE \
            --header "Authorization: Bearer $GITHUB_APP_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/installation/token
